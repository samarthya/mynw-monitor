[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netwatch"
version = "0.1.0"
description = "Local network traffic monitor and productivity classifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "streamlit>=1.35",
    "plotly>=5.20",
    "watchdog>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
netwatch-monitor = "netwatch.monitor.__main__:main"
netwatch-ui = "netwatch.ui.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
